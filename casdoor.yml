version: "3.8"

services:
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    restart: always
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: "postgres"
      dataSourceName: "host=db port=5432 user=postgres dbname=casdoor sslmode=disable password=qwerqwer"
